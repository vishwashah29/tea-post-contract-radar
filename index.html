<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal radar — Tea Post walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#0B1821; --ink2:#33373D; --muted:#69727D; --faint:#8E979E;
 --line:#E3E7E7; --line2:#EFF1F1; --bg:#EDEEEE; --surface:#fff;
 --teal:#0D5E68; --teal2:#3D7E86; --deep:#05272C; --tint:#E7EFF0; --mint:#D5E8E3;
 --indigo:#6B86D6; --coral:#E98D7D; --yellow:#EFE37E; --sea:#A9CFC9; --magenta:#CC3366;
 --r:10px; --sh:0 1px 2px rgba(11,24,33,.05),0 4px 14px rgba(11,24,33,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Hanken Grotesk",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;font-weight:600}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:56px 1fr;height:100vh;grid-template-areas:"brand top" "nav main"}
.brand{grid-area:brand;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 18px}
.mark{width:24px;height:24px;border-radius:50%;background:var(--deep);display:grid;place-items:center;flex:none}
.mark i{display:block;width:11px;height:11px;border:2px solid var(--mint);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.wordmark{font-size:16.5px;font-weight:600;letter-spacing:-.02em}
.topbar{grid-area:top;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink2);font-weight:500}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;width:262px;color:var(--faint);font-size:13px;background:#FBFCFC;white-space:nowrap}
.search svg{width:14px;height:14px;flex:none;stroke:var(--faint);fill:none;stroke-width:1.7}
.askpill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500;background:var(--surface)}
.askpill .mark{width:19px;height:19px}
.askpill .mark i{width:8px;height:8px;border-width:1.5px}
.avatar{width:28px;height:28px;border-radius:50%;background:#9242 9F;background:#92429F;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink2);font-size:13.5px}
.nav a:hover{background:#F6F8F8}
.nav a.on{background:var(--tint);color:var(--teal);font-weight:600}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.main{grid-area:main;overflow:auto;padding:20px 24px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* page head */
.phead{display:flex;align-items:flex-start;gap:13px;margin-bottom:18px}
.tile{width:40px;height:40px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none;color:var(--teal)}
.tile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.phead h1{font-size:22px;letter-spacing:-.015em}
.phead p{margin:1px 0 0;color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink2)}
.btn:hover{border-color:#C9D1D1}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.mint{background:var(--mint);border-color:var(--mint);color:var(--deep)}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:14.5px}
.card .bd{padding:16px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.stat .n{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .n s{text-decoration:none;font-size:14px;color:var(--muted);font-weight:400}
.stat .t{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.warn{border-color:#E8C4BC;background:#FDF6F4}
.stat.warn .n{color:#B5513C}

/* chart */
.chart .row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.chart .row span{color:var(--ink2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart .bar{display:flex;height:14px;border-radius:2px;overflow:hidden;min-width:3px}
.chart .bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* table */
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:0 14px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:#FAFBFB}
tbody tr.hot{background:#FDF8F6}
tbody tr.hot:hover{background:#FBF2EE}
td .sup{font-weight:500}
td .sub{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.rowlink{font-weight:500;color:var(--ink);text-decoration:none}
.rowlink:hover{color:var(--teal);text-decoration:underline}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2.5px 9px;font-size:11.5px;font-weight:500;white-space:nowrap;background:#F2F4F4;color:var(--ink2)}
.chip.ok{background:var(--mint);color:#0C4F45}
.chip.wait{background:#FBF4DC;color:#7A6410}
.chip.none{background:#FBE4DE;color:#A8442F}
.chip.teal{background:var(--tint);color:var(--teal)}
.chip.flag{background:#FBE9F0;color:#9C1F4E}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* alert banner */
.alert{display:flex;gap:13px;align-items:flex-start;background:#FDF6F4;border:1px solid #E8C4BC;border-left:3px solid var(--coral);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.alert h3{font-size:14.5px;color:#8E3A26}
.alert p{margin:3px 0 0;font-size:13.5px;color:#7A4234}
.alert .d{margin-left:auto;text-align:right;flex:none}
.alert .d b{display:block;font-size:22px;font-weight:600;color:#B5513C;line-height:1}
.alert .d s{text-decoration:none;font-size:11.5px;color:#9A6554}

/* layout */
.cols{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
.pack{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.pk h4{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.pk h4 svg{width:15px;height:15px;stroke:var(--teal2);fill:none;stroke-width:1.6}
.pk ul{margin:0;padding-left:0;list-style:none}
.pk li{font-size:13px;color:var(--ink2);padding:3.5px 0;display:flex;gap:8px}
.pk li::before{content:"";width:4px;height:4px;border-radius:50%;background:#C3CBCB;margin-top:7.5px;flex:none}
.pk.q{border-style:dashed;background:#FCFDFD}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.kv s{text-decoration:none;color:var(--muted)}
.kv b{font-weight:500}

/* rail */
.owner{text-align:center;padding:4px 0 2px}
.owner .av{width:44px;height:44px;border-radius:50%;background:#2E6E78;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;margin:0 auto 9px}
.owner .nm{font-weight:600;font-size:14.5px}
.owner .ro{font-size:12.5px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:13px;position:relative;font-size:12.5px}
.tl li:not(:last-child)::after{content:"";position:absolute;left:6px;top:15px;bottom:2px;width:1px;background:var(--line)}
.tl .pip{width:11px;height:11px;border-radius:50%;border:2px solid #CFD6D6;background:#fff;margin-top:3px;z-index:1}
.tl .now .pip{border-color:var(--coral);background:var(--coral)}
.tl .done .pip{border-color:var(--teal);background:var(--teal)}
.tl b{display:block;font-weight:600;font-size:12.5px}
.tl s{text-decoration:none;color:var(--muted)}
.tl .future{color:var(--faint)}
.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line2)}
.docs li:last-child{border:0}
.ft{width:20px;height:24px;border-radius:3px;display:grid;place-items:center;font-size:7.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.ft.pdf{background:#D4493C}.ft.doc{background:#2B6CC4}.ft.ml{background:#8A94A0}
.docs s{text-decoration:none;color:var(--muted);font-size:11.5px;display:block}

/* notes pins */
.pin{position:absolute;width:19px;height:19px;border-radius:50%;background:var(--indigo);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(107,134,214,.22);z-index:40}
.pin:hover{background:#4F6BC0}
.pop{position:fixed;z-index:90;width:272px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 32px rgba(11,24,33,.17);padding:12px 13px;font-size:13px}
.pop .tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px;display:inline-block;margin-bottom:7px}
.tag.have{background:#EEF0F2;color:#5A6470}
.tag.new{background:#E8ECFA;color:#3C56A8}
.pop p{margin:0;color:var(--ink2)}
.pop button{position:absolute;top:8px;right:9px;color:var(--faint);font-size:15px;line-height:1}

/* tour */
.scrim{position:fixed;inset:0;background:rgba(6,20,26,.52);z-index:100;backdrop-filter:blur(1px)}
.spot{position:fixed;z-index:101;border-radius:9px;box-shadow:0 0 0 9999px rgba(6,20,26,.52);pointer-events:none;transition:all .26s cubic-bezier(.4,0,.2,1);outline:2px solid rgba(213,232,227,.9);outline-offset:0}
.tip{position:fixed;z-index:103;width:328px;background:var(--surface);border-radius:11px;box-shadow:0 16px 44px rgba(6,20,26,.3);padding:17px 18px 14px;transition:all .26s cubic-bezier(.4,0,.2,1)}
.tip .arw{position:absolute;width:11px;height:11px;background:var(--surface);transform:rotate(45deg)}
.tip .who{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--teal);background:var(--tint);padding:2.5px 9px;border-radius:999px;margin-bottom:9px}
.tip h3{font-size:16px;letter-spacing:-.01em;margin-bottom:5px}
.tip p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.tip .ft2{display:flex;align-items:center;gap:10px;margin-top:15px}
.tip .prog{flex:1;display:flex;gap:4px}
.tip .prog i{height:3px;flex:1;border-radius:2px;background:#E1E6E6}
.tip .prog i.on{background:var(--teal)}
.tip .ct{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tip .x{position:absolute;top:11px;right:12px;color:var(--faint);font-size:16px;line-height:1}
.tip .skip{font-size:12.5px;color:var(--muted);text-decoration:underline;padding:0}

/* welcome */
.ov{position:fixed;inset:0;background:rgba(6,20,26,.55);z-index:200;display:grid;place-items:center;padding:24px;overflow:auto;backdrop-filter:blur(2px)}
.wel{background:var(--surface);border-radius:14px;box-shadow:0 24px 70px rgba(6,20,26,.4);width:min(760px,100%);overflow:hidden}
.wel .top2{background:linear-gradient(135deg,var(--deep),#0E4A52);color:#fff;padding:26px 30px 24px}
.wel .top2 .lbl{color:#8FBDC0}
.wel h2{font-size:26px;letter-spacing:-.02em;margin:7px 0 7px;font-weight:600}
.wel .top2 p{margin:0;font-size:14.5px;color:#C7DADC;max-width:60ch;line-height:1.55}
.facts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);border-radius:7px;padding:5px 11px;font-size:12.5px;color:#DCE9EA}
.facts b{color:#fff;font-weight:600}
.wel .bd2{padding:22px 30px 26px}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:13px 20px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line2)}
.cast div{display:flex;align-items:center;gap:8px}
.cast .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.cast b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.cast s{text-decoration:none;font-size:11.5px;color:var(--muted)}
.tours{display:grid;gap:9px}
.tr{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:9px;padding:13px 15px;text-align:left;width:100%;background:var(--surface)}
.tr:hover{border-color:var(--teal2);background:#FBFDFD}
.tr .ix{width:28px;height:28px;border-radius:7px;background:var(--tint);color:var(--teal);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.tr b{display:block;font-size:14px;font-weight:600}
.tr s{text-decoration:none;font-size:12.5px;color:var(--muted)}
.tr .go{margin-left:auto;color:var(--teal);font-size:18px;flex:none}
.tr[disabled]{opacity:.5;cursor:default}
.tr[disabled]:hover{border-color:var(--line);background:var(--surface)}
.tr[disabled] .ix{background:#F2F4F4;color:var(--faint)}
.tr[disabled] .go{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.welft{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.welft p{margin:0;font-size:12px;color:var(--faint);line-height:1.4}

.done2{text-align:center;padding:4px 0}
.done2 .tick{width:46px;height:46px;border-radius:50%;background:var(--mint);color:#0C4F45;display:grid;place-items:center;margin:0 auto 12px;font-size:21px}
@media (max-width:1000px){.app{grid-template-columns:0 1fr}.nav,.brand{display:none}.cols{grid-template-columns:1fr}.pack,.stats{grid-template-columns:1fr 1fr}}

/* phase 2 */
.btn.sm.ghost{border-color:transparent;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{padding:9px 13px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--teal);border-color:var(--teal);font-weight:600}
.tabs .cn{display:inline-block;margin-left:6px;background:#F2F4F4;color:var(--ink2);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600}
.tabs button.on .cn{background:var(--tint);color:var(--teal)}
.alert.good{background:#F2F8F6;border-color:#BFDCD3;border-left-color:var(--teal2)}
.alert.good h3{color:#0C4F45}.alert.good p{color:#35625A}
.alert.good .d b{color:var(--teal)}.alert.good .d s{color:#5C8780}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.split.wide{grid-template-columns:1.15fr 1fr}
tr.clk{cursor:pointer}
tr.sel,tr.sel:hover{background:var(--tint)}
.chip.low{background:#F1ECF8;color:#5B3C94}
.chip.chk{background:#FBF4DC;color:#7A6410}
.quote{background:#F7F9F9;border-left:3px solid var(--sea);border-radius:0 6px 6px 0;padding:11px 13px;font-size:13px;line-height:1.6;color:var(--ink2)}
.quote mark{background:#F6EBA0;padding:0 2px;border-radius:2px;color:var(--ink)}
.quote .src{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.letter{background:#FBFCFC;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.65;color:var(--ink2)}
.letter .nt{color:var(--muted);font-size:12px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;width:100%;text-align:left;font-size:13.5px;background:var(--surface)}
.opt:hover{border-color:#C9D1D1}
.opt .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #B6BFBF;flex:none;display:grid;place-items:center}
.opt.on{border-color:var(--teal2);background:#F6FAFA}
.opt.on .rd{border-color:var(--teal)}
.opt.on .rd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
.opt[disabled]{cursor:default;opacity:.75}
textarea,.in{font:inherit;font-size:13.5px;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);background:var(--surface);resize:vertical}
textarea:focus,.in:focus{outline:2px solid var(--teal2);outline-offset:0;border-color:var(--teal2)}
.fld{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px;color:var(--ink2)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.log li:last-child{border:0}
.log s{text-decoration:none;color:var(--muted)}
.askbox{display:flex;gap:8px;margin-top:11px}
.qs{display:flex;gap:8px;flex-wrap:wrap}
.qs .btn.on{background:var(--tint);border-color:#BCD3D6;color:var(--teal)}
.cite{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ans h2{font-size:18px;letter-spacing:-.01em;margin-bottom:7px}
.ans ul{margin:8px 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.ans.nf{border-style:dashed}
.foot{font-size:12px;color:var(--muted);margin-top:11px}
.tfoot{padding:10px 16px;border-top:1px solid var(--line2);font-size:12px;color:var(--faint)}
.perf{position:relative;height:130px;display:flex;align-items:flex-end;gap:7px;padding:0 4px;margin-top:22px}
.perf i{display:block;flex:1;border-radius:3px 3px 0 0;background:var(--sea)}
.perf i.m{background:var(--coral)}
.perf .lv{position:absolute;left:0;right:0;border-top:1.5px dashed var(--teal)}
.perf .lv span{position:absolute;right:0;top:-19px;font-size:11px;color:var(--teal);background:#fff;padding:0 4px;font-weight:600}
.pm{display:flex;gap:7px;padding:0 4px;margin-top:6px}
.pm span{flex:1;text-align:center;font-size:11px;color:var(--muted);line-height:1.3}
.pm b{display:block;font-weight:600;color:var(--ink2);font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:10px;padding:0}
.back:hover{color:var(--teal)}

 S.dirty=false;
 if(diff){S.screen=st.s;S.tab=tab;S.obl=ob;S.cid="kaveri";S.oid="kaveri";S.pick=false;S.edit=false;draw()}else layer();
 requestAnimationFrame(function(){var el=$(st.at);if(el)el.scrollIntoView({block:"center",behavior:"auto"});requestAnimationFrame(position)});
}
function position(){
 var st=TOURS[S.tour].steps[S.step],el=$(st.at),sp=$("#spot"),tp=$("#tip");
 if(!el||!sp||!tp)return;
 var r=el.getBoundingClientRect(),pad=6;
 sp.style.left=(r.left-pad)+"px";sp.style.top=(r.top-pad)+"px";sp.style.width=(r.width+pad*2)+"px";sp.style.height=(r.height+pad*2)+"px";
 var tw=328,th=tp.offsetHeight,gap=16,L,T,arw=tp.querySelector(".arw"),p=st.p;
 if(p==="right"&&r.right+gap+tw>innerWidth-12)p="left";
 if(p==="left"&&r.left-gap-tw<12)p="bottom";
 if(p==="bottom"&&r.bottom+gap+th>innerHeight-12)p="top";
 if(p==="top"&&r.top-gap-th<12)p="bottom";
 if(p==="bottom"){L=r.left+r.width/2-tw/2;T=r.bottom+gap;arw.style.cssText="left:calc(50% - 5px);top:-5px"}
 else if(p==="top"){L=r.left+r.width/2-tw/2;T=r.top-gap-th;arw.style.cssText="left:calc(50% - 5px);bottom:-5px"}
 else if(p==="right"){L=r.right+gap;T=r.top+r.height/2-th/2;arw.style.cssText="left:-5px;top:calc(50% - 5px)"}
 else{L=r.left-gap-tw;T=r.top+r.height/2-th/2;arw.style.cssText="right:-5px;top:calc(50% - 5px)"}
 tp.style.left=Math.max(12,Math.min(L,innerWidth-tw-12))+"px";
 tp.style.top=Math.max(12,Math.min(T,innerHeight-th-12))+"px";
 tp.focus();
}
function nextStep(){var t=TOURS[S.tour];if(S.step<t.steps.length-1){S.step++;goStep()}else{S.tour=null;S.done=true;draw()}}
function actStep(){var st=TOURS[S.tour].steps[S.step];if(st.act){st.act.fn();S.dirty=true}nextStep()}
function prevStep(){if(S.step>0){S.step--;goStep()}}
function endTour(){S.tour=null;S.done=false;draw()}

/* ================= overlays ================= */
function layer(){
 var h="";
 if(S.tour){
  var t=TOURS[S.tour],st=t.steps[S.step],last=S.step===t.steps.length-1;
  h+='<div class="spot" id="spot"></div><div class="tip" id="tip" tabindex="-1" role="dialog" aria-label="Walkthrough step '+(S.step+1)+'"><i class="arw"></i>';
  h+='<button class="x" data-a="end" aria-label="Close walkthrough">✕</button><span class="who">'+esc(st.w)+'</span><h3>'+esc(val(st.h))+'</h3><p>'+esc(val(st.b))+'</p>';
  h+='<div class="ft2'+(st.act?' two':'')+'"><div class="prog">'+t.steps.map(function(_,i){return '<i class="'+(i<=S.step?"on":"")+'"></i>'}).join("")+'</div><span class="ct">'+(S.step+1)+' / '+t.steps.length+'</span>';
  if(S.step>0)h+='<button class="btn sm" data-a="prev">Back</button>';
  if(st.act)h+='<button class="btn sm" data-a="next">Skip</button><button class="btn sm pri" data-a="act">'+esc(st.act.label)+'</button></div>';
  else h+='<button class="btn sm pri" data-a="next">'+(last?"Finish":"Next")+'</button></div>';
  if(S.step===0)h+='<div style="margin-top:9px"><button class="skip" data-a="end">Skip and explore on my own</button></div>';
  h+='</div>';
 }
 if(S.done){
  var ks=Object.keys(TOURS),ix=ks.indexOf(S.last),more=[1,2].map(function(n){return ks[(ix+n)%ks.length]});
  h+='<div class="ov"><div class="wel" style="width:min(480px,100%)"><div class="bd2" style="padding:28px 30px"><div class="done2"><div class="tick">✓</div><h2 style="font-size:19px">'+esc(TOURS[S.last].n)+'</h2><p style="margin:7px 0 0;font-size:13.5px;color:var(--muted)">'+esc(TOURS[S.last].fin)+'</p></div><div class="lbl" style="margin:20px 0 9px">Try another</div><div class="tours">'+more.map(tourRow).join("")+'</div><div class="welft"><button class="btn pri" data-a="explore">Explore on my own</button><button class="btn" data-a="restart">Replay this tour</button><button class="btn" data-a="tours" style="margin-left:auto">All walkthroughs</button></div></div></div></div>';
 }
 if(S.welcome)h+=welcome();
 if(S.pin){var d=S.pin.d,x=Math.min(S.pin.x-136,innerWidth-290),y=Math.min(S.pin.y+16,innerHeight-160);
  h+='<div class="pop" style="left:'+Math.max(10,x)+'px;top:'+Math.max(10,y)+'px"><button data-a="closepin" aria-label="Close note">✕</button><span class="tag '+(d.k==="new"?"new":"have")+'">'+(d.k==="new"?"Our proposal":"Sirion does this today")+'</span><p>'+esc(d.t)+'</p></div>';}
 if(S.about)h+=aboutPage();
 if(!S.tour&&!S.about)h+='<button class="aboutfab" data-a="about" aria-label="About this prototype"><i>i</i>About this prototype</button>';
 if(S.modal)h+=modal();
 if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
 $("#layer").innerHTML=h;
}
function tourRow(k){
 var t=TOURS[k],n=t.steps.length;
 if(t.quick)return '<button class="tq" data-tour="'+k+'"><b>'+esc(t.n)+'</b><s>'+esc(t.d)+' · '+n+' steps</s></button>';
 return '<button class="tr" data-tour="'+k+'"><span class="ix">'+k.toUpperCase()+'</span><span><b>'+esc(t.n)+'</b><s>'+esc(t.d)+' · '+n+' steps</s></span><span class="go">→</span></button>';
}
function welcome(){
 var s=stats();
 var h='<div class="ov"><div class="wel"><div class="top2"><div class="lbl">Guided walkthrough</div><h2>Tea Post signs contracts it never reads again</h2>';
 h+='<p>A tea and snacks chain in Gujarat. Terms are agreed carefully, then filed. Renewals arrive unnoticed, price rises go unchecked, and service credits are never claimed.</p>';
 h+='<div class="facts"><span><b>3,000</b> employees</span><span><b>~2,500</b> suppliers</span><span><b>'+cr(s.due12)+'</b> of annual value up for a decision within 12 months</span></div></div>';
 h+='<div class="bd2"><div class="cast">'+CAST.map(function(c){return '<div><span class="av" style="background:'+c.c+'">'+c.i+'</span><span><b>'+esc(c.n)+'</b><s>'+esc(c.r)+'</s></span></div>'}).join("")+'</div>';
 h+='<div class="lbl" style="margin-bottom:9px">Pick a walkthrough</div><div class="tours">'+["a","b","c"].map(tourRow).join("")+'</div><div class="lbl" style="margin:14px 0 9px">Quick looks</div><div class="tqs">'+["d","e"].map(tourRow).join("")+'</div>';
 h+='<div class="welft"><button class="btn" data-a="explore">Skip, let me explore</button><p>A concept prototype. Everything on screen is invented. Styled to sit inside a Sirion-like shell.</p></div></div></div></div>';
 return h;
}

function modal(){
 var id=S.cid,sp=SPEC[id],r=rowOf(id),h='<div class="ov" data-bg="1"><div class="wel" style="width:min(580px,100%)"><div class="bd2" style="padding:22px 26px 24px">';
 if(S.modal.t==="docs"){
  h+='<div style="display:flex;align-items:center;margin-bottom:12px"><h2 style="font-size:18px">Documents, '+esc(r.s)+'</h2><div class="spacer"></div><button class="btn sm" data-a="closemodal">Close</button></div><ul class="docs">';
  sp.docs.forEach(function(d,i){h+='<li class="dl" data-doc="'+i+'" tabindex="0" role="button"><span class="ft '+d[0]+'">'+(d[0]==="ml"?"EML":d[0]==="doc"?"DOC":"PDF")+'</span><div><div>'+esc(d[1])+'</div><s>'+esc(d[2])+'</s></div></li>'});
  return h+'</ul></div></div></div>';
 }
 var d=sp.docs[S.modal.i],key=d[3]||d[1],fs=FF(id).map(function(f,i){return {f:f,i:i}}).filter(function(x){return x.f.doc.indexOf(key)===0});
 h+='<div style="display:flex;align-items:flex-start;margin-bottom:6px"><div><div class="lbl">'+(d[0]==="ml"?"Email":"Document")+'</div><h2 style="font-size:18px;margin-top:3px">'+esc(d[1])+'</h2><p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">'+esc(d[2])+'</p></div><div class="spacer"></div><button class="btn sm" data-a="docs">All documents</button> <button class="btn sm" data-a="closemodal" style="margin-left:6px">Close</button></div>';
 if(d[0]==="ml")h+='<div class="letter" style="margin-top:14px">From: Kaveri Packaging<br>To: Procurement, Tea Post<br>Date: 12 March 2026<br>Subject: Volume discount<br><br>We can offer 3% off the cup price on volumes above 50,000 cups a month, from 1 April 2026.<br><br><span class="nt">Not a signed document. Not part of the contract unless Legal papers it.</span></div>';
 else{
  if(/scan/.test(d[2]))h+='<div class="scanw"><b>Low-quality scan.</b> Some words were read with low confidence and are marked not yet verified. <button class="btn sm"  data-send="Asked '+esc(r.s)+' for a clearer copy of '+esc(d[1])+'" data-cid="'+id+'">Request a clearer copy</button></div>';
  h+='<div class="lbl" style="margin:16px 0 8px">Read from this document</div>';
  if(fs.length)fs.forEach(function(x){h+='<div class="quote" style="margin-bottom:9px"><span class="src">'+esc(x.f.k)+' · '+esc(x.f.doc)+' · '+(fOK(x.i,id)?'verified':'not yet verified')+'</span>'+x.f.src+'</div>'});
  else h+='<p style="margin:0;font-size:13px;color:var(--muted)">No field was read from this document.</p>';
 }
 return h+'</div></div></div>';
}

/* ================= events ================= */
function firstUnv(){var id=S.cid,n=-1;FF(id).forEach(function(_,i){if(n<0&&!fOK(i,id))n=i});return n}
document.addEventListener("click",function(e){
 if(S.modal&&e.target.dataset&&e.target.dataset.bg){S.modal=null;layer();return}
 var t=e.target.closest("[data-a],[data-tour],[data-go],[data-open],[data-tab],[data-sel],[data-opt],[data-askq],[data-askc],[data-toast],[data-send],[data-rf],[data-sec],[data-ck],[data-rtab],[data-doc],[data-pickp],#notesbtn");
 if(S.tour&&!e.target.closest("#layer")){if(e.target.closest("a"))e.preventDefault();return}
 if(!t){if(S.pin&&!e.target.closest(".pop")){S.pin=null;layer()}return}
 if(t.tagName==="A")e.preventDefault();
 var d=t.dataset,c;
 if(d.tour){startTour(d.tour);return}
 if(t.id==="notesbtn"){S.notes=!S.notes;S.pin=null;redraw();return}
 if(d.open){openContract(d.open,d.tabAfter);return}
 if(d.go){go(d.go);return}
 if(d.tab){S.tab=d.tab;S.pin=null;S.screen="contract";S.pick=false;S.edit=false;redraw();return}
 if(d.sel!==undefined){S.sel=+d.sel;S.edit=false;S.pin=null;redraw();return}
 if(d.opt){cs().dec=d.opt;redraw();return}
 if(d.askq!==undefined){var i=+d.askq;S.ask=i;if(i<2)S.askId="kaveri";S.qtxt=Q[i];redraw();return}
 if(d.askc){S.screen="ask";S.askId=d.askc;S.ask=0;S.qtxt=d.askc==="kaveri"?Q[0]:"When must we give notice to "+rowOf(d.askc).s+"?";S.pin=null;draw();return}
 if(d.ck!==undefined){S.ck=+d.ck;TODAY=STOPS[S.ck];S.pin=null;redraw();return}
 if(d.sec){var el=document.getElementById("ab-"+d.sec);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(d.rf){S.rf=d.rf;redraw();return}
 if(d.rtab){S.rt=d.rtab;redraw();return}
 if(d.doc!==undefined){S.modal={t:"doc",i:+d.doc};layer();return}
 if(d.pickp){assign(S.cid,d.pickp);S.pick=false;redraw();toast(PEOPLE[d.pickp].n+" named as owner. Alert sent.");return}
 if(d.toast){toast(d.toast==="1"?null:d.toast);return}
 if(d.send){cs(d.cid||S.cid).log.push([td(),d.send]);redraw();toast(d.send+". Logged on the contract.");return}
 var a=d.a;
 if(a==="next")nextStep();
 else if(a==="prev")prevStep();
 else if(a==="end")endTour();
 else if(a==="explore"){S.welcome=false;S.done=false;S.tour=null;draw()}
 else if(a==="restart")startTour(S.last||"a");
 else if(a==="tours"){S.done=false;S.welcome=true;S.pin=null;S.modal=null;draw()}
 else if(a==="act")actStep();
 else if(a==="closepin"){S.pin=null;layer()}
 else if(a==="about"){S.about=true;S.pin=null;layer();var ab=$("#about");if(ab)ab.scrollTop=0}
 else if(a==="closeabout"){S.about=false;layer()}
 else if(a==="closemodal"){S.modal=null;layer()}
 else if(a==="docs"){S.modal={t:"docs"};layer()}
 else if(a==="reset"){reset();S.welcome=true;draw();var m=$("#main");if(m)m.scrollTop=0}
 else if(a==="reassign"){S.pick=true;redraw()}
 else if(a==="cancelpick"){S.pick=false;redraw()}
 else if(a==="accept"){c=cs();c.acc=true;c.accOn=td();S.pick=false;c.log.push([td(),ownerName()+" accepted ownership"]);redraw()}
 else if(a==="accf"){c=cs();c.fv[S.sel]=true;c.fd[S.sel]=td();c.log.push([td(),"Meera Joshi accepted "+FF()[S.sel].k.toLowerCase()+" as read"]);var n=firstUnv();if(n>=0)S.sel=n;redraw()}
 else if(a==="edit"){S.edit=true;redraw()}
 else if(a==="canceledit"){S.edit=false;redraw()}
 else if(a==="saveedit"){var v=(($("#editv")||{}).value||"").trim();if(!v){toast("Enter the corrected value");return}c=cs();c.val[S.sel]=v;c.fv[S.sel]=true;c.fd[S.sel]=td();c.log.push([td(),"Meera Joshi corrected "+FF()[S.sel].k.toLowerCase()+" to \""+v+"\""]);S.edit=false;var n2=firstUnv();if(n2>=0)S.sel=n2;redraw()}
 else if(a==="rec"){
  c=cs();
  if(!ownerOf()){toast("Name an owner on the Overview tab first.");return}
  if(!c.why.trim()){toast("Add a reason. It stays with the contract for next year's owner.");return}
  if(ownState(S.cid)!=="ok"){c.acc=true;c.accOn=td();c.log.push([td(),ownerName()+" accepted ownership, with the decision"])}
  c.rec=true;c.log.push([td(),"Decision: "+c.dec+". "+c.why.trim()]);redraw();
 }
 else if(a==="reopen"){c=cs();c.rec=false;c.log.push([td(),"Decision reopened. The earlier decision stays in this log"]);redraw();toast("Decision reopened")}
 else if(a==="clearrq"){S.rq="";redraw()}
 else if(a==="askgo"){var q=($("#q")||{}).value||"";S.qtxt=q;if(!q.trim()){toast("Type a question, or pick one above");return}var m2=matchQ(q);S.ask=m2.a;S.askId=m2.id;redraw()}
});
document.addEventListener("input",function(e){if(e.target.id==="why")cs().why=e.target.value;if(e.target.id==="rq"){S.rq=e.target.value;redraw();var i=$("#rq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});
document.addEventListener("keydown",function(e){
 if(e.target.id==="q"&&e.key==="Enter"){var q=e.target.value;S.qtxt=q;if(q.trim()){var m=matchQ(q);S.ask=m.a;S.askId=m.id}redraw();return}
 if(e.target.id==="editv"&&e.key==="Enter"){var b=document.querySelector('[data-a="saveedit"]');if(b)b.click();return}
 if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("dl")){e.preventDefault();e.target.click();return}
 if(S.tour){if(e.key==="Escape")endTour();if(e.key==="ArrowRight")nextStep();if(e.key==="ArrowLeft")prevStep()}
 else if(e.key==="Escape"){if(S.about){S.about=false;layer()}else if(S.modal){S.modal=null;layer()}else if(S.pin){S.pin=null;layer()}}
});
addEventListener("resize",function(){if(S.tour)position()});
draw();

</script>
</body>
</html>
